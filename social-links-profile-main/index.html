<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <title>Social links profile</title>

</head>
<body>
  <article class="card">
    <!-- Main Card Header -->
    <header class="card-header">
      <img src="assets/images/avatar-jessica.jpeg" alt="Avatar Jessica Randall">

      <!-- Personal Info -->
      <section class="personal-info">
        <h1 class="name">Jessica Randall</h1>
        <p class="location">London, United Kingdom</p>
        <p class="bio">"Front-end developer and avid reader."</p>
      </section>
    </header>

    <!-- Links -->
    <nav class="links">
      <a href="https://github.com/#" target="_blank" class="link" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.frontendmentor.io/#" target="_blank" class="link" rel="noopener noreferrer">Frontendmentor</a>
      <a href="https://www.linkedin.com/#" target="_blank" class="link" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://twitter.com/#" target="_blank" class="link" rel="noopener noreferrer">Twitter</a>
      <a href="https://www.instagram.com/#" target="_blank" class="link" rel="noopener noreferrer">Instagram</a>
    </nav>
  </article>


  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
